timezone: America/Sao_Paulo

fontes:
  dou:
    # Fazenda e Planejamento ficaram de fora em 06/09: em 04/09 encheram 69 das 120 vagas do dia com atos da Receita Federal.
    orgaos:
      - "Ministério da Saúde"
      - "Presidência da República"
    # 2º nível exigido para capturar atos publicados sob "Presidência da República".
    subunidades_extra:
      - "Casa Civil"
    delta: 75
    concorrencia: 5
    baixar_texto_integral: true
  iofmg:
    caderno: "Diário do Executivo"
    secao: "Secretaria de Estado de Saúde"
    tipos_publicacao:
      - PORTARIA
      - RESOLUÇÃO
      - DECRETO
      - DELIBERAÇÃO
      - EXTRATO
      - EDITAL
      - ATO
      - AVISO
  inlabs:
    secoes:
      - DO1
    # Fazenda e Planejamento ficaram de fora em 06/09: em 04/09 encheram 69 das 120 vagas do dia com atos da Receita Federal.
    orgaos:
      - "Ministério da Saúde"
      - "Agência Nacional de Vigilância Sanitária"
      - "Presidência da República"
    # 2º nível exigido para capturar atos publicados sob "Presidência da República".
    subunidades_extra:
      - "Casa Civil"

armazenamento:
  dir_dados: ./data
  reter_bruto_dias: 30

# Opcional. Só usado por `radar notificar`. Credenciais vêm do ambiente.
email:
  habilitado: false
  destinatarios: []

boletim:
  modelo: claude-haiku-4-5
  lote: 12
  max_chars_texto: 3000
  max_itens_dia: 120
  tentativas_llm: 2
  timeout_llm_s: 180
  site_url: "https://pedrow28.github.io/radar-diarios-oficiais"
  # Troque `dou` por `inlabs` se o portal bloquear os runners e você tiver conta INLABS.
  fontes:
    - dou
    - iofmg
  dir_saida: ./boletim/saida
  dir_site: ./site
  cta:
    whatsapp: "5531984483183"
    texto_botao: "Falar com a Thauma no WhatsApp"
    mensagem: "Olá, vi o Radar de captação de {data} e quero conversar sobre soluções de IA para saúde"
