timezone: America/Sao_Paulo

fontes:
  dou:
    orgao: "Ministério da Saúde"
    delta: 75
    concorrencia: 5
    baixar_texto_integral: true
  iofmg:
    caderno: "Diário do Executivo"
    secao: "Secretaria de Estado de Saúde"
    tipos_publicacao:
      - PORTARIA
      - RESOLUÇÃO
      - DECRETO
      - DELIBERAÇÃO
      - EXTRATO
      - EDITAL
      - ATO
      - AVISO
  inlabs:
    secoes:
      - DO1
    orgaos:
      - "Ministério da Saúde"
      - "Agência Nacional de Vigilância Sanitária"
      - "Presidência da República"
      - "Ministério da Fazenda"
      - "Ministério do Planejamento e Orçamento"
    # 2º nível exigido para capturar atos publicados sob "Presidência da República".
    subunidades_extra:
      - "Casa Civil"

armazenamento:
  dir_dados: ./data
  reter_bruto_dias: 30

# Opcional. Só usado por `radar notificar`. Credenciais vêm do ambiente.
email:
  habilitado: false
  destinatarios: []
