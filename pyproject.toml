[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-diarios"
version = "0.1.0"
description = "Coleta normalizada do DOU e do Diário Oficial de MG para consumo por agente"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyMuPDF>=1.24",
    "asn1crypto>=1.5",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
boletim = ["jinja2>=3.1"]

[project.scripts]
radar = "radar.cli:executar"
boletim = "boletim.cli:executar"

[tool.setuptools.packages.find]
include = ["radar*", "boletim*"]

[tool.setuptools.package-data]
boletim = ["templates/*.j2", "templates/site/*.j2", "assets/*.png", "assets/*.css", "assets/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
